# TM-Trading-Bot configuration. Sized for ~$550 of exchange equity; every size is a FRACTION
# of current equity (exchange USDC + stocks at mid), so it scales if you deposit more.
#
# Orderbook Arena Round 1 (ends 2026-11-30 23:59 UTC):
#   points = 3 x maker USD volume + 1 x taker USD volume; "book of the day" x2 on top.
#   Rules: no self-trading; <= 30% of volume with any single counterparty; one entrant.

# Books quoted every run. The book of the day is added automatically if missing.
# NVDAC + METAC carried ~80% of volume on day 1; PLTRC is the next most active.
books:
  - NVDAC
  - METAC
  - PLTRC

# Today's 2x book from Discord. The running bot re-reads this every minute, so you can
# change it overnight without restarting. `--book-of-day` on the command line overrides it.
book_of_the_day: null

quote_asset: USDC

strategy:
  # Closest we quote to fair value, in bps (1 bp = 0.01%). Within that limit we take queue
  # priority: improve the best price by one tick, or join it.
  half_spread_bps_regular: 6     # 9:30-16:00 ET on trading days
  half_spread_bps_extended: 12   # outside regular hours / when the reference price is stale
  # Inventory skew may pull the side that REDUCES inventory down to this edge, never closer.
  min_edge_bps: 2
  # At max inventory, quotes shift by this many bps to sell what we hold.
  inventory_skew_bps: 10
  # Our buy is at least this many ticks under the live best ask (and vice versa), checked
  # against a FRESH book right before every place/modify. The API has no post-only flag.
  no_cross_ticks: 1
  # Only move a resting quote if its target moved by more than this...
  requote_threshold_bps: 2
  # ...and never touch a quote that already sits at the best price (keeps queue priority)
  # unless it is this many bps or more away from target.
  queue_hold_bps: 4
  # Fair value = w * reference + (1 - w) * mid. The reference is a ~30 s candle and lags.
  reference_weight: 0.4
  # Reference price older than this = stale: fair uses the mid only, and the extended
  # half-spread and size apply.
  reference_stale_secs: 180

# Two layers per side. True Markets' match data: the #1 maker sits at the very front with SMALL
# size and takes the small orders; bigger orders sweep through it into makers resting a few
# ticks behind with real size. So: a small "front" order at/near the best price, and a larger
# "depth" order a few ticks behind it (still never closer to fair than half_spread).
layers:
  enabled: true
  front_pct: 0.25            # share of each side's quote size in the front layer
  depth_pct: 0.75            # share in the depth layer
  depth_ticks: 2             # depth order sits this many ticks behind the best bid/ask
  depth_requote_bps: 6       # re-price the depth order only if its target moved this much
  depth_refresh_secs: 10     # ...and at most this often (front-layer upkeep comes first)
  single_layer_books: []     # books that quote only one (front) order per side

sizing:
  quote_pct: 0.06            # each quote = 6% of equity
  botd_quote_pct: 0.12       # book of the day quote = 12% of equity
  extended_size_mult: 0.5    # quote size multiplier outside regular hours
  book_cap_pct: 0.25         # max stock held in one book, % of equity
  total_stock_cap_pct: 0.65  # max stock held across all books, % of equity
  usdc_buffer_pct: 0.08      # USDC never committed to orders (avoids 422 + wallet auto-funding)
  usdc_buffer_min_usd: 5.0   # ...but at least this much
  # Floors so a small account still quotes (sizes below the exchange's $1 minimum get skipped).
  # Applied after the off-hours and low-flow multipliers; caps and the buffer still apply.
  # With ~$550 equity, the % sizes above are already bigger, so these don't matter.
  min_quote_usd: 5.0         # every quote at least this much
  min_botd_quote_usd: 8.0    # book-of-the-day quote at least this much

flow:
  # Rolling window for fills/hour and market trades/hour per book.
  window_minutes: 60
  # A book is "low flow" when, in the window, it has fewer of OUR fills than low_flow_fills
  # AND fewer public trades/hour than low_flow_market_trades_per_hour (the book of the day
  # never is). Both are needed, so active books aren't shrunk right after a restart.
  low_flow_fills: 2
  low_flow_market_trades_per_hour: 6
  low_flow_size_mult: 0.5    # low-flow books quote smaller...
  low_flow_refresh_secs: 30  # ...and are re-priced at most this often

market:
  # Pull quotes on a book when its best price is one-sided/empty, or when the reference is
  # stale AND the book is wider than this (no trustworthy fair value).
  stale_max_spread_bps: 60
  # Pull quotes if the book has not changed at all for this long while the reference is stale.
  dead_book_secs: 1800

risk:
  daily_max_loss_usd: 20.0   # realized + unrealized since 00:00 ET; persisted across restarts
  round_max_loss_usd: 150.0  # whole round; persisted across restarts
  max_book_spread_bps: 250   # ignore books wider than this
  max_fair_mid_gap_bps: 150  # sit out if fair value and mid disagree this much
  stale_data_secs: 120       # our own snapshot older than this = don't quote
  max_actions_per_minute: 40
  # Volatility pause: if a book's mid moves more than vol_move_bps within vol_window_secs,
  # pull its quotes for vol_pause_secs.
  vol_move_bps: 40
  vol_window_secs: 30
  vol_pause_secs: 120

# Taker round trips. APPROVED by True Markets (Ben, 2026-11-19). Buy at the best ask, then
# immediately sell at the best bid (1x points per side, so a round trip of $N earns ~2N
# points and costs ~spread x N). Only used in spare order-action slots, on tight books.
taker:
  enabled: true
  max_spread_bps: 10          # only cross when the spread is at most this
  daily_cost_budget_usd: 10.0 # hard cap on taker round-trip losses per ET day
  max_trade_usd: 40.0         # per round trip notional cap
  min_trade_usd: 2.0          # don't bother below this
  prefer_book_of_the_day: true  # 2x points halves the cost per point
  book_cooldown_secs: 20      # min seconds between round trips on a book we QUOTE (lets maker quotes rest)
  # Also take round trips on these competition books even though we don't quote them. No
  # orders of ours to clear first, so trips are quick and don't cost queue position. Any
  # leftover shares are quoted sell-only until we're flat.
  extra_books: [AMZNC, TSLAC, AAPLC, GOOGLC, MSFTC, MUC, SPCXC, SNDKC, MSTRC]
  extra_book_cooldown_secs: 5
  fill_wait_secs: 2.5         # how long a taker leg may rest before the remainder is cancelled
  cancel_confirm_secs: 6.0    # self-trade guard: wait this long for our cancels to be confirmed

loop:
  poll_secs: 3.0
  # Time budget per loop for order actions (the exchange takes one action at a time).
  action_budget_secs: 2.5

pace:
  goal_points: 60000
  # Hours we expect to be able to trade, ET, for the "needed per hour" figure.
  # Regular weekday session; extended hours are on by default because trading is allowed.
  regular: "09:30-16:00"
  extended: "04:00-09:30,16:00-20:00"
  include_weekends: false
  # US market holidays / early closes in the round (no regular session / closes 13:00).
  holidays: ["2026-11-26"]
  early_closes: {"2026-11-27": "13:00"}
